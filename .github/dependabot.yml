# Dependabotは、依存関係の更新のPull Requestを自動で作成する。
# 方針は、docs/development-tools.mdの「依存関係の自動更新」に記述する。
version: 2

updates:
  # Dependabotは、Cargo.tomlの版の範囲内の更新ではCargo.lockのみを更新し、範囲を超える更新ではCargo.tomlも更新する。
  - package-ecosystem: cargo
    directory: /
    schedule: &weekly
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    # 公開の直後に取り下げられた版や、乗っ取られて公開された版を取り込まないよう、公開から3日を待つ。
    cooldown: &cooldown
      default-days: 3
    # Pull Requestの数を抑えるため、破壊的でない更新を1つのPull Requestにまとめる。
    groups:
      crates:
        update-types: [minor, patch]

  # Dependabotは、rust-toolchain.tomlのRustの版を更新する。Cargo.tomlのrust-versionは更新しない。
  - package-ecosystem: rust-toolchain
    directory: /
    schedule: *weekly
    cooldown: *cooldown

  # Dependabotは、コミットのハッシュで指定したActionsのハッシュと、版のコメントを更新する。
  - package-ecosystem: github-actions
    directory: /
    schedule: *weekly
    cooldown: *cooldown
    groups:
      github-actions:
        update-types: [minor, patch]
