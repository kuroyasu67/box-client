[package]
categories  = ["api-bindings", "web-programming::http-client"]
description = "BOXのREST APIを、JWT認証のサービスアカウントとして呼び出すクライアント"
edition     = "2024"
# 開発ツールの設定ファイルは、クレートの利用者に不要なため、パッケージに含めない
exclude      = ["deny.toml", "prek.toml", "taplo.toml"]
keywords     = ["box", "api", "client", "jwt", "cloud-storage"]
license      = "MIT OR Apache-2.0"
name         = "box-client"
repository   = "https://github.com/kuroyasu67/box-client"
rust-version = "1.91"
version      = "0.1.0"

[dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = [
  "alloc",
] }
garde = { version = "0.23.0", features = [
  "derive",
  "email",
  "regex",
  "serde",
  "url",
] }
httpdate = "1.0.3"
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
pkcs8 = { version = "0.11.0", features = [
  "encryption",
  "getrandom",
  "pem",
  "std",
] }
rand = "0.10.4"
reqwest = { version = "0.13.5", features = ["form", "json", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
# ライブラリが使用する機能だけを有効にする。`#[tokio::main]`や`tokio::join!`はテストとサンプルだけが使用する。
tokio = { version = "1.54.1", features = [
  "rt",
  "sync",
  "time",
  "fs",
  "io-util",
] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
anyhow             = "1.0.104"
rstest             = "0.28.0"
tempfile           = "3.27.0"
time               = { version = "0.3.55", features = ["macros"] }
tokio              = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
wiremock           = "0.6.5"

[lints.rust]
# 公開項目のドキュメントの漏れを検出する
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# 日本語のドキュメントでは、英字と日本語が連続する語を識別子と誤認するため無効にする
doc_markdown = "allow"
