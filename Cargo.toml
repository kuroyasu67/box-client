[package]
categories  = ["api-bindings", "web-programming::http-client"]
description = "BOXのREST APIを、JWT認証のサービスアカウントとして呼び出すクライアント"
edition     = "2024"
# 開発ツールの設定ファイルは、クレートの利用者に不要なため、パッケージに含めない
exclude      = ["deny.toml", "prek.toml", "taplo.toml"]
keywords     = ["box", "api", "client", "jwt", "cloud-storage"]
license      = "MIT OR Apache-2.0"
name         = "box-client"
repository   = "https://github.com/kuroyasu67/box-client"
rust-version = "1.91"
version      = "0.2.0"

[dependencies]
base64 = "0.23"
bytes = "1.12"
futures-util = { version = "0.3", default-features = false, features = [
  "alloc",
] }
garde = { version = "0.23", features = [
  "derive",
  "email",
  "regex",
  "serde",
  "url",
] }
httpdate = "1"
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
pkcs8 = { version = "0.11", features = [
  "encryption",
  "getrandom",
  "pem",
  "std",
] }
rand = "0.10"
reqwest = { version = "0.13", features = ["form", "json", "rustls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
# ライブラリが使用する機能だけを有効にする。`#[tokio::main]`や`tokio::join!`はテストとサンプルだけが使用する。
tokio   = { version = "1", features = ["rt", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
uuid    = { version = "1", features = ["v4"] }

[dev-dependencies]
anyhow             = "1"
rstest             = "0.28"
tempfile           = "3"
time               = { version = "0.3", features = ["macros"] }
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wiremock           = "0.6"

[lints.rust]
# 公開項目のドキュメントの漏れを検出する
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# 日本語のドキュメントでは、英字と日本語が連続する語を識別子と誤認するため無効にする
doc_markdown = "allow"
