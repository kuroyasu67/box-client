[package]
edition = "2024"
license = "MIT OR Apache-2.0"
name    = "box-client"
version = "0.1.0"

[dependencies]
bytes = "1.12.1"
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
pkcs8 = { version = "0.11.0", features = [
  "encryption",
  "getrandom",
  "pem",
  "std",
] }
rand = "0.10.4"
reqwest = { version = "0.13.5", features = ["form", "json", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
anyhow             = "1.0.104"
rstest             = "0.28.0"
time               = { version = "0.3.55", features = ["macros"] }
tokio              = { version = "1.54.1", features = ["io-util", "net"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
wiremock           = "0.6.5"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# 日本語のドキュメントでは、英字と日本語が連続する語を識別子と誤認するため無効にする
doc_markdown = "allow"
